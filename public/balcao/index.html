<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balcão · Papai Noel</title>
  <link rel="icon" href="/shared/icon-192.png">
  <link rel="stylesheet" href="balcao.css">
</head>
<body>
  <header class="top">
    <div class="brand">🎅 Balcão</div>
    <label class="search">
      <span>Família</span>
      <input id="search" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código" autofocus>
    </label>
    <label class="day">
      <span>Dia</span>
      <input id="day" type="date">
    </label>
    <div class="summary" id="summary"></div>
    <div class="conn" id="conn" data-online="false"><span class="dot"></span><span id="connText">Conectando…</span></div>
  </header>

  <main>
    <div id="families"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerCode" hidden>
    <div class="viewer-bar">
      <div class="viewer-title">
        <span>Família</span>
        <strong id="viewerCode"></strong>
        <span id="viewerInfo"></span>
      </div>
      <span class="visibility" id="viewerVisibility"></span>
      <span class="printed" id="viewerPrinted"></span>
      <button class="btn" id="viewerHide" type="button"></button>
      <div class="frame-menu" id="frameMenu">
        <button class="btn frame-toggle" id="viewerFrame" type="button" aria-haspopup="menu" aria-expanded="false">Adicionar moldura ▾</button>
        <div class="frame-options" id="viewerFrameOptions" role="menu" hidden></div>
      </div>
      <button class="btn btn-primary print-btn" type="button" data-size="4x6" data-label="Imprimir 10x15">Imprimir 10x15</button>
      <button class="btn btn-primary print-btn" type="button" data-size="6x8" data-label="Imprimir 15x20">Imprimir 15x20</button>
      <button class="btn" id="viewerClose" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody">
      <button class="nav" id="viewerPrev" type="button" aria-label="Foto anterior">‹</button>
      <img id="viewerImage" alt="">
      <div class="previews" id="viewerPreviews" hidden>
        <figure class="preview" data-size="4x6"><img alt=""><figcaption></figcaption></figure>
      </div>
      <button class="nav" id="viewerNext" type="button" aria-label="Próxima foto">›</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="balcao.js"></script>
</body>
</html>
